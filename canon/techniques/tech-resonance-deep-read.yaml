id: tech-resonance-deep-read
type: technique
name: Resonance Deep Read
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Craft Arts — Alchemy
tier: 2
description: Perceiving the complete material and resonance composition of a substance
  or object — not just what happened to it (Echo Sight) but what it is made of at
  every structural level, including accumulated Resonance residue layers, embedded
  inscriptions, True Smith bindings, and Founding Age material signatures. Requires
  Resonance Alchemy training rather than standard Resonance Arts — the perception
  is oriented toward material structure rather than event history. Practitioners use
  this as a diagnostic tool before any complex alchemical work. A Deep Read on a True
  Smithed object reveals the maker's signature — a fact that most True Smiths do not
  know.
cost: Low for simple objects. Scaling for objects with complex histories or dense
  resonance modification layers. High-residue objects risk perceptual overwhelm.
game_mechanic_concept: 'Diagnostic ability: reveals full material composition, structural
  resonance properties, historical modification layers, and any embedded alchemy or
  True Smithing modifications. Passive application when examining objects. High skill
  level reveals curse-binding modifications, maker signatures on True Smithed items,
  and Founding Age construction techniques. Overexposure to high-complexity objects
  causes temporary perceptual overload.'
