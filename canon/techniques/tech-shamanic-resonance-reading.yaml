id: tech-shamanic-resonance-reading
type: technique
name: Shamanic Resonance Reading
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Perception Arts + Mind Arts
tier: 2
description: The Vorath shamanic tradition for communicating with the Shattered —
  people who exist partially across multiple timelines. Requires placing the practitioner's
  perception partially out of normal timeline phase, creating a shared perceptual
  space where Shattered individuals can communicate without the cognitive overload
  of full timeline-crossing.
cost: Moderate. Disorienting. Prolonged use causes temporary timeline-anchor loosening
  (practitioner briefly becomes partially Shattered themselves).
game_mechanic_concept: 'Communication ability: allows conversation with Shattered
  NPCs/characters who cannot otherwise communicate coherently. Also provides brief
  timeline-adjacent perception — flickers of other timelines'' versions of the current
  location.'
