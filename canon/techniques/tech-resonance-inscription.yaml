id: tech-resonance-inscription
type: technique
name: Resonance Inscription
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Craft Arts — Alchemy
tier: 2
description: Encoding a conditional transformation instruction into an object by writing
  it in resonance energy — the instruction is embedded in the material structure,
  invisible to ordinary sight, readable by any practitioner with Resonance perception.
  The object performs the inscribed transformation when specified conditions are met.
  The inscription must be complete and internally consistent — incomplete inscriptions
  produce incomplete transformations, which means unpredictable transformations. The
  technique produces items that function without any Resonance ability in the user.
cost: High, scaling with inscription complexity and desired activation count. Inscription
  errors produce misconfigured items — failure mode discovered only at activation.
game_mechanic_concept: 'Crafting ability: create items with conditional alchemical
  effects. Specify trigger condition and transformation effect at crafting time. Item
  activates transformation when condition is met, usable repeatedly until inscription
  degrades. Complexity of inscription determines crafting time and Resonance cost.
  Advanced: multi-conditional inscriptions that respond to sequences rather than single
  triggers.'
