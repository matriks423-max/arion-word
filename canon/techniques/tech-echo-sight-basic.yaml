id: tech-echo-sight-basic
type: technique
name: Echo Sight (Basic)
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Resonance Arts
tier: 1
description: Passive perception of emotional and event residue left on objects and
  places. The practitioner feels impressions — not full visions, not complete information.
  Like reading a room that remembers what happened in it.
cost: No active cost. Passive. Overwhelming in high-residue environments.
game_mechanic_concept: 'Passive ability: when player examines an object or enters
  a location, receives fragmented impressions of past events. Higher proficiency =
  clearer impressions, longer history accessible.'
