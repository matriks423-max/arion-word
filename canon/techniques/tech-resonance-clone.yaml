id: tech-resonance-clone
type: technique
name: Resonance Clone
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Mind Arts
tier: 2
description: Creates a physical copy of the practitioner capable of independent action.
  The clone shares the practitioner's knowledge at moment of creation. As the clone
  acts and experiences, it accumulates new experience. On dissolution, the practitioner
  may attempt to recover what the clone learned — this recovery is imperfect and requires
  training.
cost: High initial cost. Clone maintenance is ongoing. Knowledge recovery is its own
  ability with its own cost.
game_mechanic_concept: 'Utility ability: create a temporary duplicate for combat,
  exploration, or parallel tasks. Advanced versions allow partial knowledge recovery
  on dissolution. Clone has a health pool separate from practitioner.'
