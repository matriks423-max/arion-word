id: tech-precision-water-compression
type: technique
name: Precision Water Compression
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Resonance Arts
tier: 2
description: 'Rather than generating large-scale water manipulation, the practitioner
  compresses a small volume of water to extreme density and accelerates it to high
  velocity. The result: a projectile the size of a coin that hits with more force
  than a thrown boulder. Uses a fraction of the energy of conventional water magic.
  Near-invisible in flight.'
cost: Low Resonance energy — the efficiency is the point.
game_mechanic_concept: 'Precision ranged attack: low energy cost, high damage, minimal
  visual telegraph. Requires significant Resonance Arts investment to unlock but is
  far more efficient than equivalent-damage conventional techniques.'
