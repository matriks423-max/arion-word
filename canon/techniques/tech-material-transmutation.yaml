id: tech-material-transmutation
type: technique
name: Material Transmutation
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Craft Arts — Alchemy
tier: 2
description: The foundational alchemical act — declare input, mass, and desired output
  clearly, then channel Open Path energy to facilitate the structural conversion.
  The matter restructures at the particle level, releasing or absorbing energy proportional
  to the complexity of the conversion. Cannot create from nothing. Cannot increase
  total mass. Simple conversions (iron to steel) take seconds; complex conversions
  (coal to diamond) take sustained hours. The practitioner must understand both source
  and target material at a deep level — transmuting what you don't understand produces
  results you didn't intend.
cost: Low to moderate Resonance energy. Scales steeply with conversion complexity.
game_mechanic_concept: 'Core alchemy ability: transmute one inorganic material into
  another of equal mass. Base ability unlocks all alchemy techniques. Complexity rating
  of target material determines time and Resonance energy cost. Failure on high-complexity
  transmutations produces unexpected substances — typically inert but occasionally
  hazardous.'
