id: tech-grain-weave
type: technique
name: Grain Weave
provenance:
  introduced_episode: 1
  last_changed_episode: 1
  source_run: migration-v1
branch: Craft Arts — True Smithing
tier: 1
description: 'The foundation of True Smithing — working metal while maintaining continuous
  Resonance awareness through the material, feeling the grain structure through Open
  Path perception and guiding the physical work to align it optimally. A blade worked
  with Grain Weave has material consistency that conventional metallurgy cannot replicate:
  the grain runs without interruption through the length, the stress distribution
  is perfect, the edge geometry is precise in ways that appear almost mathematical.
  Standard smithing is external — you work the surface and infer the interior. Grain
  Weave is internal — you feel the interior and work from it. Brix''s family calls
  this ''keeping company with the metal.'' The Guild curriculum calls it ''resonance-assisted
  quality monitoring.'' Both descriptions are accurate and both miss the point.'
cost: Moderate Resonance energy sustained over the full working period. Available
  to lower-tier practitioners than full True Forge Bind.
game_mechanic_concept: 'Passive technique: active throughout all True Smithing work.
  Improves finished object''s base physical properties (durability, edge geometry,
  structural integrity, weight distribution) significantly above standard smithing
  equivalents. Requires sustained Resonance attention — distraction or fatigue causes
  quality degradation. Available to any practitioner with Open Path access and smithing
  skill, even without formal True Smithing training.'
