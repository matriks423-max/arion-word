payoff_description: Elara Marsh is Dena Croft. The woman through the window is the
  only person alive who has read all of Erian's fourth document and can explain to
  Kairo what he is. She has been 90 metres from him for two and a half years. He has
  walked past her shop at least a hundred times. When Dena finally approaches him
