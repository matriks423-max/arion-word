payoff_description: She is Fael — the Unnamed One — 847 years old, the last living
  person who knew Erian personally, who has been waiting for the Threshold Configuration
  to emerge for centuries. She has been watching Kairo since before Dena Croft moved
  to the outer district. She does not intervene because she has been deciding whether
  to for eight hundred years. When she finally speaks in Episode 200, the audience
  will have seen her in the background of dozens of scenes. She was never absent.
