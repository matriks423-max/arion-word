payoff_description: 'The Unnamed One — Fael — personally preserved all three documents
  across 2847 years. She was in Caelum City when the Veilkeepers tried to destroy
  the historical record. She hid the documents. She placed them where they would eventually
  be found by the right people. When Fael is finally revealed in Episode 180, Tobias''s
  phrase replays with devastating weight: he was right that the Veilkeepers couldn''t
  burn them. He didn''t know there was a person whose entire life for eight centuries
  had been refusing to let them.'
