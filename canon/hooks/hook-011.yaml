payoff_description: 'The woman is Dena Croft. She had come to within forty metres
  of Malec''s building — close enough that his perimeter Listeners would have flagged
  her presence — and then turned back. She has been doing this periodically for three
  years: approaching the Veilkeeper infrastructure and retreating. Malec does not
  know. When this moment is revisited in Episode 130, the audience understands she
  was making the decision that Episode 130 finally forces her to complete. She has
  been standing at the edge of this for years.'
