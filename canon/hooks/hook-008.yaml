payoff_description: Vesper is a Mirror who has memorised the second Founding Age document
  in full. The sign she wrote is not a bookseller's motto — it is the final line of
  that document, which she absorbed so completely she no longer knows it came from
  somewhere. When Kairo eventually needs the passage she carries, the sign will play
  back and the audience will understand she has been holding it in plain sight from
  the beginning.
